!DOCTYPE html>
<html lang="pt-br">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Hub de Conteúdo</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      background-color: #111;
      color: #fff;
      margin: 0;
      padding: 0;
    }
    .header {
      padding: 20px;
      text-align: center;
      background: #1c1c1c;
    }
    .header h1 {
      margin: 0;
      font-size: 28px;
      color: #f4c542;
    }
    .modules {
      display: grid;
      grid-template-columns: 1fr;
      gap: 20px;
      padding: 20px;
    }
    .module {
      background: #222;
      border: 1px solid #333;
      border-radius: 10px;
      padding: 15px;
      text-align: center;
    }
    .module img {
      width: 100%;
      max-height: 200px;
      object-fit: cover;
      border-radius: 8px;
    }
    .module h3 {
      color: #f4c542;
    }
    .unlock-btn {
      display: inline-block;
      margin-top: 10px;
      padding: 10px 20px;
      background-color: #f4c542;
      color: #111;
      text-decoration: none;
      font-weight: bold;
      border-radius: 5px;
    }
    .unlock-btn:hover {
      background-color: #e4b832;
    }
  </style>
</head>
<body>

  <div class="header">
    <h1>REVENVM: Conteúdo Exclusivo</h1>
  </div>

  <div class="modules">

    <div class="module locked">
      <img src="https://raw.githubusercontent.com/niero-design/hub-digital/main/assets/arquivos-sombrios.jpg" alt="Arquivos Sombrios">
      <h3>Arquivos Sombrios</h3>
      <p>O conteúdo que você nunca verá num curso aberto.</p>
      <a href="https://pagamentos.kirvano.com/SEU-LINK-AQUI" target="_blank" class="unlock-btn">Desbloquear</a>
    </div>

  </div>

</body>
</html>
